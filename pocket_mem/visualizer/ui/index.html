<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>pocket-mem</title>
<script src="https://d3js.org/d3.v7.min.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: #0a0a0f;
  color: #e5e7eb;
  font-family: ui-monospace, 'Cascadia Code', 'Fira Code', monospace;
  overflow: hidden;
  user-select: none;
}

/* ── Parallax star field canvases ── */
.star-canvas {
  position: fixed;
  top: 0; left: 0;
  width: 100vw; height: 100vh;
  pointer-events: none;
  z-index: 0;
}

@keyframes drift-far  { 0%{transform:translate(0,0)} 100%{transform:translate(-12px,-6px)} }
@keyframes drift-mid  { 0%{transform:translate(0,0)} 100%{transform:translate(-22px,-11px)} }
@keyframes drift-near { 0%{transform:translate(0,0)} 100%{transform:translate(-38px,-19px)} }

#star-far  { animation: drift-far  24s ease-in-out infinite alternate; }
#star-mid  { animation: drift-mid  15s ease-in-out infinite alternate; }
#star-near { animation: drift-near  9s ease-in-out infinite alternate; }

svg#graph {
  position: fixed;
  inset: 0;
  width: 100vw;
  height: 100vh;
  z-index: 1;
}

/* Controls — top-left */
#controls {
  position: fixed;
  top: 16px;
  left: 16px;
  z-index: 10;
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 11px;
  color: #6b7280;
}

.ctrl-btn {
  background: #1a1a2e;
  border: 1px solid #2d2d44;
  color: #9ca3af;
  padding: 4px 8px;
  border-radius: 4px;
  cursor: pointer;
  font-family: inherit;
  font-size: 11px;
  transition: border-color 0.15s, color 0.15s;
}
.ctrl-btn:hover { border-color: #6b7280; color: #e5e7eb; }

.count-badge {
  padding: 4px 8px;
  background: #111118;
  border: 1px solid #1e1e30;
  border-radius: 4px;
  color: #6b7280;
  font-size: 11px;
}

/* Search — top-center */
#search-container {
  position: fixed;
  top: 16px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 10;
}

#search {
  background: #111118;
  border: 1px solid #2d2d44;
  color: #e5e7eb;
  padding: 6px 14px;
  border-radius: 20px;
  font-family: inherit;
  font-size: 12px;
  width: 220px;
  outline: none;
  transition: border-color 0.2s, width 0.2s;
}
#search::placeholder { color: #4b5563; }
#search:focus {
  border-color: #6366f1;
  width: 300px;
}

/* Filters badge — bottom-left */
#filters-bar {
  position: fixed;
  bottom: 16px;
  left: 16px;
  z-index: 10;
  font-size: 11px;
  color: #6b7280;
  display: flex;
  align-items: center;
  gap: 8px;
}

.filter-tag {
  background: #1a1a2e;
  border: 1px solid #2d2d44;
  padding: 3px 8px;
  border-radius: 4px;
  color: #9ca3af;
}

/* Back button (focus mode) */
#back-btn {
  position: fixed;
  top: 16px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 20;
  display: none;
  background: #1a1a2e;
  border: 1px solid #6366f1;
  color: #a5b4fc;
  padding: 6px 16px;
  border-radius: 20px;
  cursor: pointer;
  font-family: inherit;
  font-size: 12px;
}
#back-btn:hover { background: #23233a; }

/* Node card */
#node-card {
  position: fixed;
  z-index: 20;
  display: none;
  background: #0f0f1a;
  border: 1px solid #2d2d44;
  border-radius: 8px;
  padding: 12px 14px;
  min-width: 200px;
  max-width: 280px;
  font-size: 11px;
  line-height: 1.6;
  pointer-events: none;
  box-shadow: 0 4px 24px #00000080;
}

.card-header {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  margin-bottom: 6px;
}
.card-label { font-size: 14px; font-weight: 600; color: #f9fafb; min-width: 0; flex: 1; word-break: break-word; overflow-wrap: anywhere; }
.card-type { font-size: 10px; color: #6b7280; }
.card-divider { border: none; border-top: 1px solid #1e1e30; margin: 6px 0; }
.card-row { display: flex; justify-content: space-between; }
.card-key { color: #6b7280; }
.card-val { color: #d1d5db; max-width: 160px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.card-summary { color: #9ca3af; font-style: italic; margin-top: 4px; line-height: 1.5; }
.card-importance-bar {
  height: 3px;
  background: #1e1e30;
  border-radius: 2px;
  margin-top: 6px;
  overflow: hidden;
}
.card-importance-fill { height: 100%; background: #6366f1; border-radius: 2px; }

/* Pulse animation for search */
@keyframes pulse-ring {
  0%   { stroke-width: 2; stroke-opacity: 0.8; r: var(--r); }
  100% { stroke-width: 0; stroke-opacity: 0; r: calc(var(--r) + 12px); }
}
.pulse { animation: pulse-ring 1s ease-out infinite; }

/* Legend — top-right */
#legend {
  position: fixed;
  top: 16px;
  right: 16px;
  z-index: 10;
  background: #111118;
  border: 1px solid #1e1e30;
  border-radius: 6px;
  padding: 10px 12px;
  font-size: 11px;
}
.legend-title {
  color: #4b5563;
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  margin-bottom: 6px;
}
.legend-item {
  display: flex;
  align-items: center;
  gap: 7px;
  color: #9ca3af;
  padding: 2px 0;
}
.legend-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  flex-shrink: 0;
}

/* Detail panel (click) */
#detail-panel {
  position: fixed;
  top: 0;
  right: 0;
  width: 300px;
  height: 100vh;
  background: #0d0d1a;
  border-left: 1px solid #2d2d44;
  z-index: 30;
  overflow-y: auto;
  display: none;
  padding: 16px;
}

#detail-close {
  float: right;
  background: none;
  border: 1px solid #2d2d44;
  color: #6b7280;
  width: 24px;
  height: 24px;
  border-radius: 4px;
  cursor: pointer;
  font-size: 16px;
  line-height: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: inherit;
  margin-bottom: 8px;
}
#detail-close:hover { color: #e5e7eb; border-color: #6b7280; }

.detail-type-badge {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 10px;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  margin-bottom: 8px;
  border: 1px solid;
}

.detail-label {
  font-size: 17px;
  font-weight: 700;
  line-height: 1.3;
  margin-bottom: 14px;
  word-break: break-word;
  overflow-wrap: anywhere;
  clear: both;
}

.detail-section { margin-top: 14px; }

.detail-section-title {
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: #4b5563;
  margin-bottom: 6px;
  padding-bottom: 4px;
  border-bottom: 1px solid #1e1e30;
}

.detail-attr-row {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 8px;
  padding: 3px 0;
  font-size: 11px;
}
.detail-attr-key { color: #6b7280; flex-shrink: 0; text-transform: capitalize; }
.detail-attr-val { color: #d1d5db; text-align: right; word-break: break-word; }

.detail-text {
  font-size: 11px;
  color: #9ca3af;
  line-height: 1.65;
  word-break: break-word;
}

.detail-conn-item {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 5px 0;
  border-bottom: 1px solid #111118;
}

.detail-conn-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  flex-shrink: 0;
}

.detail-conn-label {
  font-size: 11px;
  color: #e5e7eb;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.detail-conn-meta {
  font-size: 10px;
  color: #4b5563;
  margin-top: 1px;
}

.detail-imp-bar {
  height: 3px;
  background: #1e1e30;
  border-radius: 2px;
  margin-top: 6px;
  overflow: hidden;
}
.detail-imp-fill { height: 100%; border-radius: 2px; }
</style>
</head>
<body>
<canvas id="star-far"  class="star-canvas"></canvas>
<canvas id="star-mid"  class="star-canvas"></canvas>
<canvas id="star-near" class="star-canvas"></canvas>

<div id="controls">
  <button class="ctrl-btn" id="btn-zoom-in">+</button>
  <button class="ctrl-btn" id="btn-zoom-out">−</button>
  <button class="ctrl-btn" id="btn-reset">⟳</button>
  <span class="count-badge" id="count-badge">— nodes · — edges</span>
</div>

<div id="search-container">
  <input id="search" type="text" placeholder="search nodes…" autocomplete="off">
</div>

<button id="back-btn">← back</button>

<svg id="graph"></svg>

<div id="node-card"></div>

<div id="filters-bar"></div>

<div id="legend"><div class="legend-title">Node Types</div></div>

<div id="detail-panel"></div>

<script>
// ── Data injected by server.py ──────────────────────────────────────────────
const GRAPH = __GRAPH_DATA__;
const INITIAL_SEARCH = __INITIAL_SEARCH__;

// ── Color palette ────────────────────────────────────────────────────────────
const COLOR = {
  topic:          '#a78bfa',
  entity_person:  '#34d399',
  entity_tool:    '#60a5fa',
  entity_project: '#fbbf24',
  entity_company: '#f87171',
  entity_concept: '#f472b6',
  memory_chunk:   '#6b7280',   // gray
  tone:           '#fb923c',   // orange — all tones share one color
  event:          '#e5e7eb',
  default:        '#6b7280',
};

// ── Legend ────────────────────────────────────────────────────────────────────
const LEGEND_ENTRIES = [
  { color: COLOR.topic,          label: 'Topic'   },
  { color: COLOR.entity_person,  label: 'Person'  },
  { color: COLOR.entity_project, label: 'Project' },
  { color: COLOR.entity_tool,    label: 'Tool'    },
  { color: COLOR.entity_company, label: 'Company' },
  { color: COLOR.entity_concept, label: 'Concept' },
  { color: COLOR.memory_chunk,   label: 'Memory'  },
  { color: COLOR.tone,           label: 'Tone'    },
];
const legendEl = document.getElementById('legend');
LEGEND_ENTRIES.forEach(({ color, label }) => {
  legendEl.innerHTML += `<div class="legend-item"><span class="legend-dot" style="background:${color}"></span>${label}</div>`;
});

function nodeColor(d) {
  if (d.node_type === 'topic') return COLOR.topic;
  if (d.node_type === 'entity') return COLOR[`entity_${d.entity_type}`] || COLOR.default;
  if (d.node_type === 'memory_chunk') return COLOR.memory_chunk;
  if (d.node_type === 'tone') return COLOR.tone;
  if (d.node_type === 'event') return COLOR.event;
  return COLOR.default;
}

function nodeRadius(d) {
  return 4 + (d.importance || 0.5) * 12;
}

function nodeBrightness(d) {
  if (!d.updated_at) return 0.6;
  const days = (Date.now() - new Date(d.updated_at)) / 86400000;
  return Math.max(0.3, 1 - days / 30);
}

function brightenColor(hex, factor) {
  const r = parseInt(hex.slice(1,3), 16);
  const g = parseInt(hex.slice(3,5), 16);
  const b = parseInt(hex.slice(5,7), 16);
  const blend = (c) => Math.round(c * factor + 255 * (1 - factor));
  return `rgb(${blend(r)},${blend(g)},${blend(b)})`;
}

// ── Setup ────────────────────────────────────────────────────────────────────
const svg = d3.select('#graph');
const width = window.innerWidth;
const height = window.innerHeight;

const g = svg.append('g');  // zoomable container

// Build lookup maps
const nodeById = new Map(GRAPH.nodes.map(n => [n.id, n]));
const edgesByNode = new Map();
GRAPH.nodes.forEach(n => edgesByNode.set(n.id, []));
GRAPH.edges.forEach(e => {
  (edgesByNode.get(e.from) || []).push(e);
  (edgesByNode.get(e.to)   || []).push(e);
});

// Topic node lookup for gravity
const topicNodes = GRAPH.nodes.filter(n => n.node_type === 'topic');
const topicById  = new Map(topicNodes.map(n => [n.id, n]));

// Attach topic reference to each non-topic node
GRAPH.nodes.forEach(n => {
  if (n.node_type === 'topic') return;
  const topicEdge = GRAPH.edges.find(e =>
    (e.from === n.id || e.to === n.id) &&
    (topicById.has(e.from) || topicById.has(e.to))
  );
  if (topicEdge) {
    const tid = topicById.has(topicEdge.from) ? topicEdge.from : topicEdge.to;
    n._topic = topicById.get(tid);
  }
});

// D3 forceLink expects source/target; our data uses from/to
GRAPH.edges.forEach(e => { e.source = e.from; e.target = e.to; });

// ── D3 force simulation ───────────────────────────────────────────────────
const simulation = d3.forceSimulation(GRAPH.nodes)
  .force('link', d3.forceLink(GRAPH.edges)
    .id(d => d.id)
    .distance(e => 80 / Math.max(e.weight || 0.5, 0.1))
  )
  .force('charge', d3.forceManyBody().strength(-220))
  .force('center', d3.forceCenter(width / 2, height / 2))
  .force('collision', d3.forceCollide().radius(d => nodeRadius(d) + 6));

// Topic gravity
simulation.force('topic-gravity', () => {
  GRAPH.nodes.forEach(n => {
    if (n._topic && n._topic.x != null) {
      const tx = n._topic.x - n.x;
      const ty = n._topic.y - n.y;
      const dist = Math.sqrt(tx * tx + ty * ty) || 1;
      n.vx += (tx / dist) * 0.25;
      n.vy += (ty / dist) * 0.25;
    }
  });
});

// ── Zoom ─────────────────────────────────────────────────────────────────────
const zoom = d3.zoom()
  .scaleExtent([0.1, 8])
  .on('zoom', e => g.attr('transform', e.transform));

svg.call(zoom);

const zoomIn  = () => svg.transition().duration(300).call(zoom.scaleBy, 1.4);
const zoomOut = () => svg.transition().duration(300).call(zoom.scaleBy, 0.7);
const resetView = () => svg.transition().duration(400).call(
  zoom.transform, d3.zoomIdentity.translate(width / 2, height / 2).scale(0.9).translate(-width / 2, -height / 2)
);

d3.select('#btn-zoom-in').on('click', zoomIn);
d3.select('#btn-zoom-out').on('click', zoomOut);
d3.select('#btn-reset').on('click', resetView);

// ── Render edges ──────────────────────────────────────────────────────────────
const edgeGroup = g.append('g').attr('class', 'edges');

const edgeLine = edgeGroup.selectAll('line')
  .data(GRAPH.edges)
  .join('line')
  .attr('stroke', e => {
    const src = nodeById.get(e.from);
    return src ? nodeColor(src) : '#444';
  })
  .attr('stroke-opacity', e => e.valid ? 0.35 : 0.12)
  .attr('stroke-width', e => 0.5 + (e.weight || 0.5) * 2)
  .attr('stroke-dasharray', e => e.valid ? null : '4 4');

// ── Render nodes ──────────────────────────────────────────────────────────────
const nodeGroup = g.append('g').attr('class', 'nodes');

const nodeCircle = nodeGroup.selectAll('circle')
  .data(GRAPH.nodes)
  .join('circle')
  .attr('r', d => nodeRadius(d))
  .attr('fill', d => brightenColor(nodeColor(d), nodeBrightness(d)))
  .attr('stroke', d => nodeColor(d))
  .attr('stroke-width', 1.5)
  .attr('stroke-opacity', 0.6)
  .attr('cursor', 'pointer')
  .call(
    d3.drag()
      .on('start', (event, d) => {
        if (!event.active) simulation.alphaTarget(0.3).restart();
        d.fx = d.x; d.fy = d.y;
      })
      .on('drag', (event, d) => { d.fx = event.x; d.fy = event.y; })
      .on('end', (event, d) => {
        if (!event.active) simulation.alphaTarget(0);
        d.fx = null; d.fy = null;
      })
  );

// ── Node labels (hidden by default) ──────────────────────────────────────────
const labelGroup = g.append('g').attr('class', 'labels');

const nodeLabel = labelGroup.selectAll('text')
  .data(GRAPH.nodes)
  .join('text')
  .attr('font-size', 10)
  .attr('font-family', 'ui-monospace, monospace')
  .attr('fill', '#9ca3af')
  .attr('text-anchor', 'middle')
  .attr('pointer-events', 'none')
  .attr('dy', d => nodeRadius(d) + 13)
  .text(d => d.label)
  .attr('opacity', 0);

// ── Simulation tick ───────────────────────────────────────────────────────────
simulation.on('tick', () => {
  edgeLine
    .attr('x1', e => e.source.x).attr('y1', e => e.source.y)
    .attr('x2', e => e.target.x).attr('y2', e => e.target.y);
  nodeCircle.attr('cx', d => d.x).attr('cy', d => d.y);
  nodeLabel.attr('x', d => d.x).attr('y', d => d.y);
});

// ── Count badge ───────────────────────────────────────────────────────────────
d3.select('#count-badge').text(
  `${GRAPH.nodes.length} nodes · ${GRAPH.edges.length} edges`
);

// ── Filters badge ─────────────────────────────────────────────────────────────
const filtersBar = d3.select('#filters-bar');
if (GRAPH.meta.filters_applied && GRAPH.meta.filters_applied.length > 0) {
  filtersBar.append('span').attr('class', 'filter-tag').text('Filters:');
  GRAPH.meta.filters_applied.forEach(f => {
    filtersBar.append('span').attr('class', 'filter-tag').text(f);
  });
}

// ── Hover state ───────────────────────────────────────────────────────────────
const card = d3.select('#node-card');

function showCard(event, d) {
  const color = nodeColor(d);
  const imp = (d.importance || 0.5);
  const attrs = Object.entries(d.attributes || {}).slice(0, 6);

  let html = `
    <div class="card-header">
      <span class="card-label" style="color:${color}">${d.label}</span>
      <span class="card-type">${d.node_type}${d.entity_type ? '/' + d.entity_type : ''}</span>
    </div>
    <hr class="card-divider">`;

  attrs.forEach(([k, v]) => {
    html += `<div class="card-row">
      <span class="card-key">${k}</span>
      <span class="card-val" title="${v}">${v}</span>
    </div>`;
  });

  if (d.summary) {
    html += `<hr class="card-divider">
      <div class="card-summary">${d.summary.slice(0, 120)}${d.summary.length > 120 ? '…' : ''}</div>`;
  }

  html += `<hr class="card-divider">
    <div class="card-importance-bar">
      <div class="card-importance-fill" style="width:${imp * 100}%; background:${color}"></div>
    </div>
    <div class="card-row" style="margin-top:4px">
      <span class="card-key">importance</span>
      <span class="card-val">${imp.toFixed(2)}</span>
    </div>`;

  card.html(html).style('display', 'block');
  _positionCard(event);
}

function _positionCard(event) {
  const cw = 280, ch = 200;
  let x = event.pageX + 14;
  let y = event.pageY - 20;
  if (x + cw > window.innerWidth)  x = event.pageX - cw - 14;
  if (y + ch > window.innerHeight) y = window.innerHeight - ch - 10;
  card.style('left', x + 'px').style('top', y + 'px');
}

function hideCard() {
  card.style('display', 'none');
}

function highlightNeighbors(d, factor) {
  const connectedIds = new Set([d.id]);
  (edgesByNode.get(d.id) || []).forEach(e => {
    connectedIds.add(e.from);
    connectedIds.add(e.to);
  });

  nodeCircle.attr('opacity', n => connectedIds.has(n.id) ? 1 : factor);
  edgeLine.attr('opacity', e =>
    (e.source.id === d.id || e.target.id === d.id) ? 1 : factor * 0.5
  );
  // Scale hovered/clicked node and its neighbours
  nodeCircle.filter(n => n.id === d.id).attr('r', nodeRadius(d) * 1.3);
  nodeCircle.filter(n => connectedIds.has(n.id) && n.id !== d.id)
    .attr('r', n => nodeRadius(n) * 1.1);
}

function resetOpacity() {
  nodeCircle.attr('opacity', 1).attr('r', d => nodeRadius(d));
  edgeLine.attr('opacity', 1);
  nodeLabel.attr('opacity', 0);
}

nodeCircle
  .on('mouseover', (event, d) => {
    if (focusNode) return;
    showCard(event, d);
    if (!searchInput.property('value').trim()) highlightNeighbors(d, 0.2);
  })
  .on('mousemove', (event) => {
    if (focusNode) return;
    _positionCard(event);
  })
  .on('mouseout', () => {
    if (focusNode) return;
    hideCard();
    if (!searchInput.property('value').trim()) resetOpacity();
  });

// ── Detail panel (click) ──────────────────────────────────────────────────────
const detailPanel = document.getElementById('detail-panel');

function friendlyType(d) {
  if (d.node_type === 'entity') {
    const t = d.entity_type || '';
    return t ? t.charAt(0).toUpperCase() + t.slice(1) : 'Entity';
  }
  if (d.node_type === 'memory_chunk') return 'Memory';
  if (d.node_type === 'topic') return 'Topic';
  if (d.node_type === 'tone') {
    const v = d.valence || '';
    return v ? v.charAt(0).toUpperCase() + v.slice(1) + ' Tone' : 'Tone';
  }
  return d.node_type.replace(/_/g, ' ');
}

function showDetailPanel(d) {
  const color = nodeColor(d);
  const edges = edgesByNode.get(d.id) || [];
  const connections = edges.map(e => {
    const otherId = e.from === d.id ? e.to : e.from;
    const other = nodeById.get(otherId);
    return other ? { node: other, relation: e.relation } : null;
  }).filter(Boolean);

  const isChunk = d.node_type === 'memory_chunk';
  const displayLabel = isChunk ? 'Memory Record' : d.label;
  const attrs = Object.entries(d.attributes || {})
    .filter(([, v]) => v !== null && v !== '' && v !== undefined);
  const summary = d.summary || '';
  const imp = d.importance || 0.5;

  let html = `
    <button id="detail-close" onclick="closeDetailPanel()">×</button>
    <div class="detail-type-badge" style="color:${color};border-color:${color}">${friendlyType(d)}</div>
    <div class="detail-label" style="color:${color}">${displayLabel}</div>`;

  if (attrs.length > 0) {
    html += `<div class="detail-section">
      <div class="detail-section-title">Details</div>`;
    attrs.forEach(([k, v]) => {
      html += `<div class="detail-attr-row">
        <span class="detail-attr-key">${k.replace(/_/g, ' ')}</span>
        <span class="detail-attr-val">${v}</span>
      </div>`;
    });
    html += `</div>`;
  }

  if (summary) {
    html += `<div class="detail-section">
      <div class="detail-section-title">${isChunk ? 'Content' : 'Summary'}</div>
      <div class="detail-text">${summary}</div>
    </div>`;
  }

  if (connections.length > 0) {
    html += `<div class="detail-section">
      <div class="detail-section-title">Connections &nbsp;<span style="font-weight:400;letter-spacing:0">${connections.length}</span></div>`;
    connections.forEach(({ node, relation }) => {
      const c = nodeColor(node);
      const lbl = node.node_type === 'memory_chunk' ? 'Memory Record' : node.label;
      const rel = relation ? relation.replace(/_/g, ' ') : '—';
      html += `<div class="detail-conn-item">
        <div class="detail-conn-dot" style="background:${c}"></div>
        <div style="min-width:0">
          <div class="detail-conn-label">${lbl}</div>
          <div class="detail-conn-meta">${rel} · ${friendlyType(node)}</div>
        </div>
      </div>`;
    });
    html += `</div>`;
  }

  html += `<div class="detail-section">
    <div class="detail-attr-row">
      <span class="detail-attr-key">importance</span>
      <span class="detail-attr-val">${imp.toFixed(2)}</span>
    </div>
    <div class="detail-imp-bar">
      <div class="detail-imp-fill" style="width:${imp*100}%;background:${color}"></div>
    </div>
  </div>`;

  detailPanel.innerHTML = html;
  detailPanel.style.display = 'block';
}

function closeDetailPanel() {
  detailPanel.style.display = 'none';
}

// ── Focus mode (click) ────────────────────────────────────────────────────────
let focusNode = null;
const backBtn = d3.select('#back-btn');

function enterFocus(d) {
  focusNode = d;
  hideCard();
  clearSearch();
  highlightNeighbors(d, 0.08);
  showDetailPanel(d);
}

function exitFocus() {
  focusNode = null;
  resetOpacity();
  closeDetailPanel();
  clearSearch();
}

nodeCircle.on('click', (event, d) => {
  event.stopPropagation();
  if (focusNode === d) {
    exitFocus();
  } else {
    enterFocus(d);
  }
});

svg.on('click', () => {
  if (focusNode) exitFocus();
});

backBtn.on('click', exitFocus);

// ── Search ────────────────────────────────────────────────────────────────────
const searchInput = d3.select('#search');
let searchTimer = null;
let pulseSelection = null;

function applySearch(term) {
  if (pulseSelection) {
    pulseSelection.remove();
    pulseSelection = null;
  }
  if (!term) {
    resetOpacity();
    return;
  }
  const t = term.toLowerCase();
  const matchIds = new Set(
    GRAPH.nodes
      .filter(n =>
        n.label.toLowerCase().includes(t) ||
        JSON.stringify(n.attributes).toLowerCase().includes(t) ||
        (n.summary || '').toLowerCase().includes(t)
      )
      .map(n => n.id)
  );

  nodeCircle.attr('opacity', n => matchIds.has(n.id) ? 1 : 0.1);
  edgeLine.attr('opacity', 0.05);
  nodeLabel.attr('opacity', n => matchIds.has(n.id) ? 0.9 : 0);

  // Pulse rings on matching nodes
  pulseSelection = g.append('g').attr('class', 'pulse-group');
  GRAPH.nodes.filter(n => matchIds.has(n.id)).forEach(n => {
    pulseSelection.append('circle')
      .attr('cx', n.x || 0).attr('cy', n.y || 0)
      .attr('r', nodeRadius(n))
      .attr('fill', 'none')
      .attr('stroke', nodeColor(n))
      .attr('stroke-width', 2)
      .attr('class', 'pulse')
      .style('--r', nodeRadius(n) + 'px');
  });
}

function clearSearch() {
  searchInput.property('value', '');
  applySearch('');
}

searchInput.on('input', function() {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => applySearch(this.value.trim()), 200);
});

searchInput.on('keydown', function(event) {
  if (event.key === 'Escape') clearSearch();
});

// Pre-fill initial search if provided
if (INITIAL_SEARCH) {
  searchInput.property('value', INITIAL_SEARCH);
  // wait for simulation to settle before applying
  setTimeout(() => applySearch(INITIAL_SEARCH), 1500);
}

// Update pulse positions on tick
simulation.on('tick.pulse', () => {
  if (!pulseSelection) return;
  const term = searchInput.property('value').trim().toLowerCase();
  if (!term) return;
  const matchIds = new Set(
    GRAPH.nodes.filter(n => n.label.toLowerCase().includes(term)).map(n => n.id)
  );
  pulseSelection.selectAll('circle')
    .data(GRAPH.nodes.filter(n => matchIds.has(n.id)))
    .attr('cx', n => n.x || 0)
    .attr('cy', n => n.y || 0);
});

// Window resize
window.addEventListener('resize', () => {
  simulation.force('center', d3.forceCenter(window.innerWidth / 2, window.innerHeight / 2));
  simulation.alpha(0.1).restart();
  fillStarCanvas('star-far',  220, 1001, [0.3, 0.9], [0.10, 0.38]);
  fillStarCanvas('star-mid',   90, 2002, [0.6, 1.4], [0.26, 0.58]);
  fillStarCanvas('star-near',  30, 3003, [1.1, 2.2], [0.48, 0.86]);
});

// ── Parallax star field ───────────────────────────────────────────────────────
function fillStarCanvas(id, count, seed, szRange, opRange) {
  const canvas = document.getElementById(id);
  canvas.width  = window.innerWidth;
  canvas.height = window.innerHeight;
  const ctx = canvas.getContext('2d');
  let s = seed;
  function rand() { s |= 0; s = s + 0x6D2B79F5 | 0; let t = Math.imul(s ^ s >>> 15, 1 | s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }
  for (let i = 0; i < count; i++) {
    const x  = rand() * canvas.width;
    const y  = rand() * canvas.height;
    const r  = szRange[0] + rand() * (szRange[1] - szRange[0]);
    const op = opRange[0] + rand() * (opRange[1] - opRange[0]);
    const tint = rand();
    const col = tint < 0.12 ? `rgba(180,210,255,${op})` : tint < 0.22 ? `rgba(255,240,210,${op})` : `rgba(255,255,255,${op})`;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fillStyle = col;
    ctx.fill();
  }
}

fillStarCanvas('star-far',  220, 1001, [0.3, 0.9], [0.10, 0.38]);
fillStarCanvas('star-mid',   90, 2002, [0.6, 1.4], [0.26, 0.58]);
fillStarCanvas('star-near',  30, 3003, [1.1, 2.2], [0.48, 0.86]);
</script>
