[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pocket-mem"
version = "1.0.5"
description = "Persistent knowledge graph memory for AI agents — drop in with two lines, runs in the background, no external database required."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Simon Yarmo" }
]
keywords = ["memory", "knowledge-graph", "ai-agents", "llm", "embeddings", "semantic-search", "sqlite", "ollama"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["requests", "sentence-transformers"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
pocket-mem = "pocket_mem.visualizer.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["pocket_mem*"]

[tool.setuptools.package-data]
"pocket_mem.visualizer.ui" = ["*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
log_cli = true
log_cli_level = "WARNING"

[project.urls]
Homepage = "https://github.com/simonyarmo/pocket-mem"