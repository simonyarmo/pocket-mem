services:

  # ── Ollama — local LLM inference ──────────────────────────────────────────
  ollama:
    image: ollama/ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    # Start server then pull the model (idempotent — skips download if already cached)
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        ollama serve &
        until ollama list >/dev/null 2>&1; do sleep 1; done
        ollama pull qwen2.5:7b
        wait
    # NVIDIA GPU passthrough — remove the deploy block if you have no GPU
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # ── pocket-mem HTTP sidecar ───────────────────────────────────────────────
  memory-agent:
    build: .
    ports:
      - "8000:8000"
    environment:
      # ── Ingestion model (always Ollama/local) ─────────────────────────────
      OLLAMA_BASE_URL: http://ollama:11434/v1
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:7b}
      MEMORY_PATH: /data/memory
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_KEY: ${SUPABASE_KEY:-}
      # ── Answer model (optional — any OpenAI-compatible API) ───────────────
      # Leave blank to use the same Ollama model for answers.
      # Example for Claude Haiku: set these in your .env file:
      #   ANSWER_BASE_URL=https://api.anthropic.com/v1
      #   ANSWER_MODEL=claude-haiku-4-5-20251001
      #   ANSWER_API_KEY=sk-ant-...
      ANSWER_BASE_URL: ${ANSWER_BASE_URL:-}
      ANSWER_MODEL: ${ANSWER_MODEL:-}
      ANSWER_API_KEY: ${ANSWER_API_KEY:-}
    volumes:
      - memory_data:/data/memory
    depends_on:
      - ollama

volumes:
  ollama_data:
  memory_data:
